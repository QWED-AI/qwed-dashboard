sonar.projectKey=QWED-AI_qwed-dashboard
sonar.organization=qwed-ai
sonar.projectName=qwed-dashboard

sonar.sources=src
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fail the scan, and so the SonarCloud check, when the quality gate fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
