name: Release

# Pushing a version tag (v0.2.0) builds the dashboard and publishes a GitHub
# release with the built site as a zip, an SBOM, their SHA-256 checksums and
# the notes for that version from CHANGELOG.md. The zip gets two signed
# attestations: build provenance, and the SBOM. RELEASING.md has the steps.
#
# Run by hand (Actions > Release > Run workflow) on main, it does everything
# except publish: a dry run for the version in package.json, to try the
# release before tagging. Its attestations name main, not a tag.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create
      id-token: write # sign the attestations (Sigstore)
      attestations: write # store the attestations on this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the main check below needs main's history

      # No npm cache: a tag run can restore entries saved by other branches,
      # and this job can write releases.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # A tag names the version, and package.json must say the same. A dry
      # run takes the version from package.json.
      - name: Work out the version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$EVENT" = "push" ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::Tag $REF_NAME does not match package.json version $version"
              exit 1
            fi
          elif [ "$REF_NAME" != "main" ]; then
            echo "::error::Run the dry run on main, not $REF_NAME"
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"

      # A release is cut only from a commit that is on main.
      - name: Check the commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi

      # The same checks as CI, on the tagged commit. No dependency needs its
      # install script (see ci.yml).
      - run: npm ci --ignore-scripts
      - run: npm test
      # Built without VITE_QWED_API_BASE, so the site calls /api on its own origin.
      - run: npm run build
      - run: npm audit --audit-level=moderate

      - name: Take the notes for this version from CHANGELOG.md
        run: |
          awk -v want="## [${TAG#v}]" '
            index($0, "## [") == 1 { on = (index($0, want) == 1); next }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi

      # One folder in the zip, so it never unpacks over the current directory.
      - name: Package the built site
        run: |
          name="qwed-dashboard-$TAG"
          mkdir -p "release/$name"
          cp -R dist/. "release/$name/"
          cd release
          zip -r -X -q "$name.zip" "$name"
          rm -r "$name"

      # Every package in the build, in CycloneDX. What ships in the zip has
      # scope "required"; build and test tools are "optional" and marked
      # development. Not `--omit dev`: npm then leaves out react and react-dom,
      # which the site needs. The check below fails the release if a runtime
      # dependency in package.json is not listed as required.
      - name: Write the SBOM
        run: |
          sbom="release/qwed-dashboard-$TAG.cdx.json"
          npm sbom --sbom-format cyclonedx --sbom-type application > "$sbom"
          node - "$sbom" <<'EOF'
          const bom = require(require('node:path').resolve(process.argv[2]));
          const required = new Set(bom.components.filter((c) => c.scope === 'required').map((c) => c.name));
          const missing = Object.keys(require('./package.json').dependencies).filter((d) => !required.has(d));
          if (missing.length) {
            console.log(`::error::The SBOM does not list as required: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log(`SBOM: ${bom.components.length} packages, ${required.size} required`);
          EOF

      - name: Write the checksums
        run: |
          cd release
          sha256sum "qwed-dashboard-$TAG.zip" "qwed-dashboard-$TAG.cdx.json" > SHA256SUMS
          cat SHA256SUMS

      # Signed with a short-lived certificate for this workflow run, recorded
      # in the public Sigstore log, and stored on this repository. Anyone can
      # check them with `gh attestation verify` (see RELEASING.md).
      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/qwed-dashboard-${{ env.TAG }}.zip

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/qwed-dashboard-${{ env.TAG }}.zip
          sbom-path: release/qwed-dashboard-${{ env.TAG }}.cdx.json

      # The same checks a user runs, before anything is published.
      - name: Verify the attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="release/qwed-dashboard-$TAG.zip"
          for type in https://slsa.dev/provenance/v1 https://cyclonedx.org/bom; do
            gh attestation verify "$zip" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --predicate-type "$type" \
              --deny-self-hosted-runners
          done

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "release/qwed-dashboard-$TAG.zip" \
            "release/qwed-dashboard-$TAG.cdx.json" \
            release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "qwed-dashboard $TAG" \
            --notes-file notes.md

      - name: Say what a dry run skipped
        if: github.event_name != 'push'
        run: echo "::notice::Dry run for $TAG on main. Everything ran except publishing the release."
