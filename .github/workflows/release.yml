name: Release

# Pushing a version tag (v0.1.0) builds the dashboard and publishes a GitHub
# release with the built site as a zip, its SHA-256 checksum, and the notes
# for that version from CHANGELOG.md.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # The tag names the version; package.json must say the same.
      - name: Check the tag against package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      # The same checks as CI, on the tagged commit. No dependency needs its
      # install script (see ci.yml).
      - run: npm ci --ignore-scripts
      - run: npm test
      # Built without VITE_QWED_API_BASE, so the site calls /api on its own origin.
      - run: npm run build
      - run: npm audit --audit-level=moderate

      - name: Take the notes for this version from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v want="## [${TAG#v}]" '
            index($0, "## [") == 1 { on = (index($0, want) == 1); next }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi

      # One folder in the zip, so it never unpacks over the current directory.
      - name: Package the built site
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="qwed-dashboard-$TAG"
          mkdir -p "release/$name"
          cp -R dist/. "release/$name/"
          cd release
          zip -r -X -q "$name.zip" "$name"
          sha256sum "$name.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "release/qwed-dashboard-$TAG.zip" release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "qwed-dashboard $TAG" \
            --notes-file notes.md
