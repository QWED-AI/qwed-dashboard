version: 2
updates:
  # Security updates are on in the repository settings and are not delayed.
  # These are routine version updates: monthly, and only for releases at
  # least 14 days old.
  #
  # Minor and patch updates arrive together in one PR. Each major update gets
  # its own PR, so its changelog can be read and tested on its own. A package
  # joins the first group it matches, in the order below.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '06:00'
      timezone: UTC
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    ignore:
      # The types follow the Node.js major the project runs on (22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Packages that only install together, at any update type. Exact
      # names: with the '@vitest/*' wildcard, Dependabot still opened
      # @vitest/coverage-v8 5 on its own (#9) next to vitest 5 (#7), and
      # neither PR could install alone.
      vitest:
        patterns: ['vitest', '@vitest/coverage-v8']
      # vite 8 needs @vitejs/plugin-react 6, and plugin-react 6 needs vite 8
      # (#11, #12).
      vite:
        patterns: ['vite', '@vitejs/plugin-react']
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '06:00'
      timezone: UTC
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
