version: 2
updates:
  # Security updates are on in the repository settings and are not delayed.
  # These are routine version updates: monthly, and only for releases at
  # least 14 days old.
  #
  # Minor and patch updates arrive together in one PR. Each major update gets
  # its own PR, so its changelog can be read and tested on its own. A package
  # joins the first group it matches, in the order below.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '06:00'
      timezone: UTC
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    ignore:
      # The types follow the Node.js major the project runs on (22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # vitest and its coverage plugin must stay on the same version.
      vitest:
        patterns: ['vitest', '@vitest/*']
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '06:00'
      timezone: UTC
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
